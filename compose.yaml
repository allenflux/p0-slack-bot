services:
  p0-slack-curl-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p0-slack-curl-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-3000}
      BACKEND_ROOT: /backend
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    command: ["sh", "scripts/start.sh"]
